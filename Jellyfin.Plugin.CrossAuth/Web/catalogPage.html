<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Federated Library</title>
</head>
<body>
<div id="CrossAuthCatalogPage" data-role="page" class="page type-interior pluginConfigurationPage">
  <div data-role="content">
    <div id="caVersionBanner" style="display:none; margin:1em; padding:12px; border-radius:6px; background:#b71c1c; color:#fff;"></div>
    <div class="content-primary" id="caMain">

      <style>
        .ca-toolbar { display: flex; gap: 10px; flex-wrap: wrap; margin: 1em 0; align-items: center; }
        .ca-toolbar input, .ca-toolbar select { padding: 8px; border-radius: 4px; border: 1px solid #555;
                                                background: #222; color: #eee; }
        .ca-legend span { margin-right: 14px; white-space: nowrap; }
        .ca-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 14px; }
        .ca-card { position: relative; cursor: pointer; }
        .ca-cover { width: 100%; aspect-ratio: 2 / 3; background: #333; border-radius: 6px; overflow: hidden; }
        .ca-cover img { width: 100%; height: 100%; object-fit: cover; display: block; }
        .ca-dot { position: absolute; top: 8px; right: 8px; width: 14px; height: 14px; border-radius: 50%;
                  border: 2px solid #fff; box-shadow: 0 0 4px rgba(0, 0, 0, 0.8); }
        .ca-title { margin-top: 6px; font-size: 0.9em; }
        .ca-server { opacity: 0.6; font-size: 0.8em; }
        .ca-dotlegend { display: inline-block; width: 11px; height: 11px; border-radius: 50%; margin-right: 4px; }
      </style>

      <h1>Federated Library</h1>

      <div class="ca-legend">
        <span><i class="ca-dotlegend" style="background:#43a047"></i>Plenty of slots</span>
        <span><i class="ca-dotlegend" style="background:#fb8c00"></i>Few slots left</span>
        <span><i class="ca-dotlegend" style="background:#e53935"></i>Full</span>
        <span><i class="ca-dotlegend" style="background:#888"></i>Offline</span>
      </div>

      <div class="ca-toolbar">
        <input id="caSearch" type="search" placeholder="Search titles">
        <select id="caServerFilter"><option value="">All servers</option></select>
        <span id="caStatus"></span>
      </div>

      <div id="caGrid" class="ca-grid"></div>

    </div>
  </div>

  <script type="text/javascript">
    // CATALOG PAGE
    // Shows movies and series from all paired servers. Each cover gets a coloured dot that shows how
    // many guest slots are still free on that server.
    // Related to: CatalogController (GET /CrossAuth/Catalog and POST /CrossAuth/Connect)
    (function () {
      var page = document.querySelector('#CrossAuthCatalogPage');
      var servers = []; // the latest answer from the server, kept so filtering needs no new request

      // Escapes text so server supplied names can never inject html.
      function esc(text) {
        return String(text == null ? '' : text).replace(/[&<>"']/g, function (c) {
          return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
        });
      }

      // Picks the dot colour from the free slots of a server.
      function dotColor(server) {
        if (!server.Online) return '#888';                           // grey: offline
        if (server.SlotsMax <= 0 || server.SlotsLeft <= 0) return '#e53935'; // red: full
        return server.SlotsLeft / server.SlotsMax > 0.5 ? '#43a047' : '#fb8c00'; // green or orange
      }

      // Text shown when hovering the dot.
      function dotTooltip(server) {
        if (!server.Online) return server.ServerName + ': offline';
        return server.ServerName + ': ' + server.SlotsLeft + ' of ' + server.SlotsMax + ' slots free';
      }

      // Fills the server drop down once the data arrived.
      function fillServerFilter() {
        var select = page.querySelector('#caServerFilter');
        select.innerHTML = '<option value="">All servers</option>' + servers.map(function (s) {
          return '<option value="' + esc(s.PairingId) + '">' + esc(s.ServerName) + '</option>';
        }).join('');
      }

      // Draws the grid, applying the search text and the server filter.
      function render() {
        var search = page.querySelector('#caSearch').value.trim().toLowerCase();
        var serverFilter = page.querySelector('#caServerFilter').value;
        var html = '';

        servers.forEach(function (server) {
          if (serverFilter && server.PairingId !== serverFilter) return;

          server.Items.forEach(function (item) {
            if (search && item.Name.toLowerCase().indexOf(search) < 0) return;

            var image = server.BaseUrl + '/Items/' + item.Id + '/Images/Primary?maxHeight=450&quality=80';
            html += '<div class="ca-card" data-pairing="' + esc(server.PairingId) + '" data-item="' + esc(item.Id) + '">'
              + '<div class="ca-cover"><img loading="lazy" src="' + esc(image) + '" onerror="this.style.display=\'none\'"></div>'
              + '<span class="ca-dot" style="background:' + dotColor(server) + '" title="' + esc(dotTooltip(server)) + '"></span>'
              + '<div class="ca-title">' + esc(item.Name) + (item.Year ? ' (' + item.Year + ')' : '') + '</div>'
              + '<div class="ca-server">' + esc(server.ServerName) + '</div>'
              + '</div>';
          });
        });

        page.querySelector('#caGrid').innerHTML = html || '<p>Nothing to show.</p>';
      }


      // Asks the plugin whether this Jellyfin is new enough. If not, shows a red banner with the
      // update message and hides the normal screen. Returns a promise of true (ok) or false (too old).
      // Related to: Api/StatusController.cs
      function checkSupported() {
        return ApiClient.ajax({ type: 'GET', url: ApiClient.getUrl('CrossAuth/Status'), dataType: 'json' })
          .then(function (status) {
            page.querySelector('#caVersionBanner').style.display = status.Supported ? 'none' : 'block';
            page.querySelector('#caVersionBanner').textContent = status.Message || '';
            page.querySelector('#caMain').style.display = status.Supported ? '' : 'none';
            return !!status.Supported;
          })
          .catch(function () { return true; }); // if the check itself fails, do not block the page
      }

      // Loads the combined catalog from our own server (which asks all paired servers).
      function load() {
        checkSupported().then(function (supported) {
          if (!supported) return;

          var status = page.querySelector('#caStatus');
          status.textContent = 'Loading...';

          ApiClient.ajax({ type: 'GET', url: ApiClient.getUrl('CrossAuth/Catalog'), dataType: 'json' })
            .then(function (result) {
              servers = result;
              var offline = servers.filter(function (s) { return !s.Online; }).length;
              status.textContent = offline ? offline + ' server(s) offline' : '';
              fillServerFilter();
              render();
            })
            .catch(function () { status.textContent = 'Could not load the catalog.'; });
        });
      }

      // Click on a cover: ask for a ticket, then open the remote server in a new tab.
      function onCardClick(card) {
        // Open the tab right away (inside the click) so the browser's popup blocker allows it.
        var tab = window.open('', '_blank');

        ApiClient.ajax({
          type: 'POST',
          url: ApiClient.getUrl('CrossAuth/Connect'),
          data: JSON.stringify({ PairingId: card.dataset.pairing, ItemId: card.dataset.item }),
          contentType: 'application/json',
          dataType: 'json'
        })
          .then(function (result) {
            if (tab) { tab.opener = null; tab.location = result.Url; }
          })
          .catch(function (response) {
            if (tab) tab.close();
            var full = response && response.status === 409;
            Dashboard.alert(full ? 'No free slot on that server right now.' : 'Could not connect to that server.');
          });
      }

      page.addEventListener('pageshow', load);
      page.querySelector('#caSearch').addEventListener('input', render);
      page.querySelector('#caServerFilter').addEventListener('change', render);
      page.querySelector('#caGrid').addEventListener('click', function (event) {
        var card = event.target.closest('.ca-card');
        if (card) onCardClick(card);
      });
    })();
  </script>
</div>
</body>
</html>
