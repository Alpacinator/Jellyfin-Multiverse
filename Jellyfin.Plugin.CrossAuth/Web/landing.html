<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>Signing you in</title>
  <style>
    body { font-family: sans-serif; background: #101010; color: #eee; display: flex;
           align-items: center; justify-content: center; height: 100vh; margin: 0; text-align: center; }
  </style>
</head>
<body>
  <div id="msg">Signing you in...</div>

  <script>
    // LANDING PAGE
    // Opened in the guest's browser by the home server's catalog page.
    // Steps: read the ticket from the address, swap it for a real login, save the login the way the
    // Jellyfin web client expects it, then jump into the Jellyfin web client.
    // Related to: FederationController.Landing and FederationController.Redeem
    (function () {
      var msg = document.getElementById('msg');
      var params = new URLSearchParams(window.location.search);
      var ticket = params.get('ticket');
      var itemId = params.get('itemId');

      // The address of this server, including Jellyfin's optional base path (for example /jellyfin).
      var basePath = window.location.pathname.replace(/\/CrossAuth\/Landing.*$/, '');
      var baseUrl = window.location.origin + basePath;

      // Makes a random hex id (used as a device id when the browser has none yet).
      function randomId() {
        var bytes = new Uint8Array(16);
        crypto.getRandomValues(bytes);
        return Array.from(bytes, function (b) { return b.toString(16).padStart(2, '0'); }).join('');
      }

      if (!ticket) {
        msg.textContent = 'Missing ticket.';
        return;
      }

      // Reuse the Jellyfin web client's device id so the login belongs to this browser.
      var deviceId = localStorage.getItem('_deviceId2');
      if (!deviceId) {
        deviceId = randomId();
        localStorage.setItem('_deviceId2', deviceId);
      }

      fetch(baseUrl + '/CrossAuth/Redeem', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ Ticket: ticket, DeviceId: deviceId, DeviceName: 'Federated browser' })
      })
        .then(function (response) {
          if (response.status === 409) throw new Error('No free slot on this server right now. Try again later.');
          if (!response.ok) throw new Error('Could not sign in (the ticket may have expired).');
          return response.json();
        })
        .then(function (data) {
          // This is the format the Jellyfin web client keeps its logins in.
          // NOTE: it replaces any login this browser already had for this server address.
          var credentials = {
            Servers: [{
              ManualAddress: baseUrl,
              Id: data.ServerId,
              UserId: data.UserId,
              AccessToken: data.AccessToken,
              DateLastAccessed: Date.now(),
              LastConnectionMode: 2,
              Name: data.ServerName
            }]
          };
          localStorage.setItem('jellyfin_credentials', JSON.stringify(credentials));

          var target = itemId ? '#/details?id=' + encodeURIComponent(itemId) : '#/home';
          window.location.replace(baseUrl + '/web/index.html' + target);
        })
        .catch(function (error) {
          msg.textContent = error.message;
        });
    })();
  </script>
</body>
</html>
